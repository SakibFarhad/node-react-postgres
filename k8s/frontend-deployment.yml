apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-frontend-deployment
  namespace: dev
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: client-frontend:0.0.1
        ports:
        - containerPort: 80
