apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend-deployment
  namespace: dev
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: api-backend:0.0.1
        ports:
        - containerPort: 8010