services:
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend 
    networks:
      - client-side
    depends_on:
      - api-server
    ports:
      - 80:80

  api-server:
    build:
      context: ./
      dockerfile: Dockerfile.backend
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_NAME=${POSTGRES_DB}
      - DB_PASS=${POSTGRES_PASS}
    ports:
      - ${PORT_DEV}:${PORT_DEV}
    networks:
      - server-side
    depends_on:
      - db
   
  db:
    image: postgres:18-bookworm
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGDATA=${PGDATA}
    networks:
      - server-side
    volumes:
      - db-data:${PGDATA}

networks:
  client-side: {}
  server-side: {}

volumes:
  db-data: {}
